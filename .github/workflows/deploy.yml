name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"

jobs:
  # ─── Detect what changed ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      auth: ${{ steps.filter.outputs.auth }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Find apps that changed
        id: filter
        run: |
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            APPS_JSON=$(npx turbo run build --filter="...[HEAD^1]" --dry-run=json 2>/dev/null || echo '{"packages": ["@repo/web","@repo/auth","@repo/admin","@repo/api"]}')
          else
            APPS_JSON='{"packages": ["@repo/web","@repo/auth","@repo/admin","@repo/api"]}'
          fi
          echo "web=$(echo $APPS_JSON | jq -e '.packages | contains(["@repo/web"])' >/dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "auth=$(echo $APPS_JSON | jq -e '.packages | contains(["@repo/auth"])' >/dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "admin=$(echo $APPS_JSON | jq -e '.packages | contains(["@repo/admin"])' >/dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "api=$(echo $APPS_JSON | jq -e '.packages | contains(["@repo/api"])' >/dev/null && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # ─── Deploy apps/web ────────────────────────────────────────────────────────
  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy apps/web to Vercel
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  # ─── Deploy apps/auth ───────────────────────────────────────────────────────
  deploy-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy apps/auth to Vercel
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/auth
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/auth
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/auth
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AUTH_PROJECT_ID }}

  # ─── Deploy apps/admin ──────────────────────────────────────────────────────
  deploy-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy apps/admin to Vercel
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/admin
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/admin
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

  # ─── Deploy apps/api ────────────────────────────────────────────────────────
  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy apps/api to Vercel
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/api
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/api
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
